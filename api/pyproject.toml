[project]
name = "piki-api"
version = "0.2.0"
description = "API do piki-web, nova versão do Piki"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    # consulta de CEP no ViaCEP
    "httpx>=0.27",
]

[project.optional-dependencies]
# leitura dos bancos MariaDB das filiais, usada pelo ETL
legado = [
    "pymysql>=1.1",
    # lê o MariaDB local com a autenticação do Windows (root sem senha), que o pymysql não tem
    "mariadb>=1.1; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
