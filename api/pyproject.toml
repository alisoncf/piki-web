[project]
name = "piki-api"
version = "0.2.0"
description = "API do piki-web, nova versão do Piki"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
]

[project.optional-dependencies]
# driver do banco (decisão P7 em aberto): instale o que for usar
mariadb = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "etl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
